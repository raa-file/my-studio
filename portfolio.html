<style>
:root{
  --paper:#FBFAF8; --ink:#1F1A1D; --muted:#756C71; --line:rgba(31,26,29,.13);
  --rose:#E0447A; --rose-ink:#B8285C; --blush:#F7DCE4; --surface:#F2EEEC;
  --f-top:#EEE7EA; --f-bot:#F8F5F6; --f-cover:#FFFFFF; --f-line:rgba(31,26,29,.14); --f-shadow:rgba(70,20,45,.22);
  --ar:"Alexandria",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --lat:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --pad:clamp(20px,5vw,72px);
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#171215; --ink:#F3EEF0; --muted:#A99FA4; --line:rgba(243,238,240,.14);
    --rose:#F06A98; --rose-ink:#F58FB2; --blush:#3A2430; --surface:#211A1E; color-scheme:dark;
    --f-top:#3A3236; --f-bot:#231D20; --f-cover:#1B1619; --f-line:rgba(243,238,240,.16); --f-shadow:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --paper:#171215; --ink:#F3EEF0; --muted:#A99FA4; --line:rgba(243,238,240,.14);
  --rose:#F06A98; --rose-ink:#F58FB2; --blush:#3A2430; --surface:#211A1E; color-scheme:dark;
    --f-top:#3A3236; --f-bot:#231D20; --f-cover:#1B1619; --f-line:rgba(243,238,240,.16); --f-shadow:rgba(0,0,0,.65);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html.is-locked{overflow:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ar);font-size:17px;line-height:1.75;font-weight:400;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3,p{margin:0}
.lat{font-family:var(--lat);font-weight:400}
:focus-visible{outline:2px solid var(--rose);outline-offset:4px;border-radius:2px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--ink);color:var(--paper);padding:10px 16px;z-index:200}
.skip:focus{top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.top{position:fixed;inset:0 0 auto;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px var(--pad);transition:background .3s,backdrop-filter .3s,padding .3s}
.top.is-scrolled{background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-block:12px;box-shadow:0 1px 0 var(--line)}
.top.is-scrolled.menu-open,.top.menu-open{backdrop-filter:none;-webkit-backdrop-filter:none;background:transparent;box-shadow:none}
.logo{display:flex;align-items:center}
/* هوية ريم الحربي: الاسم بدرجتين من الوردي + GRAPHIC DESIGN */
.wm{--wm-1:#E3367F;--wm-2:#E7848E;display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.wm__ar{font-family:var(--ar);font-weight:700;font-size:21px;line-height:1.55;letter-spacing:-.01em;white-space:nowrap}
.wm__ar b{font-weight:700;color:var(--wm-1)}
.wm__ar b+b{color:var(--wm-2)}
.wm__en{font-family:var(--ar);font-weight:500;font-size:7.5px;line-height:1;letter-spacing:.42em;margin-top:1px;margin-inline-end:-.42em;color:var(--wm-2);direction:ltr}
.wm--lg .wm__ar{font-size:clamp(34px,4.4vw,52px);line-height:1.75}
.wm--lg .wm__en{font-size:clamp(10px,1.05vw,13px);margin-top:.9em}
.nav{display:flex;align-items:center;gap:30px;font-size:15px}
.nav a{position:relative;padding-block:4px}
.nav a::after{content:"";position:absolute;inset:auto 0 0;height:1px;background:currentColor;transform:scaleX(0);transform-origin:right;transition:transform .35s var(--ease)}
.nav a:hover::after,.nav a[aria-current="true"]::after{transform:scaleX(1)}
.theme{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.theme svg{width:16px;height:16px}
.menu-btn{display:none;font-size:15px;padding:8px 0;align-items:center;gap:10px}
.menu-btn span{position:relative;display:block;width:22px;height:8px}
.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;inset-inline:0;height:1.5px;background:currentColor;transition:transform .3s var(--ease),top .3s var(--ease)}
.menu-btn span::before{top:0}.menu-btn span::after{top:6.5px}
/* ---------- Hero / folder stack ---------- */
.hero{padding:clamp(110px,11vw,140px) var(--pad) clamp(70px,9vw,120px);overflow:hidden}
.hero__lead{text-align:center;font-size:clamp(20px,2.4vw,32px);font-weight:300;line-height:1.6;max-width:23em;margin-inline:auto;color:var(--muted)}
.hero__hint{text-align:center;font-size:14px;color:var(--muted);margin-top:20px}
.stack{--peek:66px;--tabh:46px;--ov:40px;max-width:1120px;margin:clamp(40px,5vw,64px) auto 0;padding-top:var(--tabh)}
.folder{position:relative;display:block;height:calc(var(--peek) + var(--ov));margin-top:calc(var(--ov) * -1);border:1px solid var(--f-line);border-bottom:0;border-radius:26px 26px 0 0;background:linear-gradient(var(--f-top),var(--f-bot) 90px);box-shadow:0 -14px 34px -18px var(--f-shadow);transition:transform .7s cubic-bezier(.34,1.5,.64,1)}
.folder:first-child{margin-top:0}
.folder__tab{position:absolute;bottom:100%;inset-inline-start:var(--x,6%);height:var(--tabh);margin-bottom:-1px;display:flex;align-items:center;padding:0 22px;background:var(--f-top);border:1px solid var(--f-line);border-bottom:0;border-radius:18px 18px 0 0;font-size:14px;font-weight:500;white-space:nowrap;transition:color .3s,background .3s}
.folder__tab .t-short{display:none}
.folder--accent .folder__tab small{color:#fff;opacity:.8}
.folder__tab small{font-size:11px;font-weight:400;color:var(--muted);margin-inline-start:7px;transform:translateY(-4px)}
.folder__meta{position:absolute;top:16px;inset-inline-end:28px;font-size:13px;color:var(--muted);opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s}
.folder:not(.folder--cover):hover,.folder:not(.folder--cover):focus-visible{transform:translateY(-14px)}
.folder:not(.folder--cover):hover .folder__tab{color:var(--rose-ink)}
.folder:hover .folder__meta,.folder:focus-visible .folder__meta{opacity:1;transform:none}
.folder.is-pulling{transform:translateY(-44px)!important;transition-duration:.3s}
.folder--accent .folder__tab{background:var(--rose);border-color:var(--rose);color:#fff}
.folder--accent:hover .folder__tab{color:#fff!important;background:var(--rose-ink)}
.folder:focus-visible{outline:none}
.folder:focus-visible .folder__tab{outline:2px solid var(--rose);outline-offset:3px}
.folder--cover{height:auto;border-bottom:1px solid var(--f-line);border-radius:26px;background:linear-gradient(var(--f-top),var(--f-cover) 120px);padding:clamp(40px,5vw,70px) clamp(22px,5vw,68px) clamp(34px,5vw,60px);box-shadow:0 -14px 34px -18px var(--f-shadow),0 40px 70px -50px var(--f-shadow)}
.folder--cover .folder__tab{font-weight:400;color:var(--muted);gap:8px}
@media (hover:none){.folder__meta{opacity:1;transform:none}}

.hero__name{font-weight:400;margin:0}
.sel{position:relative;display:inline-block;direction:ltr;padding:.06em .12em .1em;margin-inline:-.12em}
.sel__text{display:block;font-family:var(--lat);font-weight:400;font-size:clamp(52px,9.4vw,158px);line-height:.95;letter-spacing:-.025em}
.sel__box{position:absolute;inset:0;border:1.5px solid var(--rose);pointer-events:none}
.sel__h{position:absolute;width:11px;height:11px;background:var(--f-cover);border:1.5px solid var(--rose);transition:transform .3s var(--ease)}
.sel__h:nth-child(1){top:-6px;left:-6px}.sel__h:nth-child(2){top:-6px;right:-6px}
.sel__h:nth-child(3){bottom:-6px;left:-6px}.sel__h:nth-child(4){bottom:-6px;right:-6px}
.sel:hover .sel__h{transform:scale(1.35)}
.sel__tag{position:absolute;bottom:100%;left:-1px;margin-bottom:8px;font-family:var(--ar);font-size:12px;line-height:1;color:#fff;background:var(--rose);padding:5px 8px;white-space:nowrap}
.sel__size{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:12px;font-family:var(--ar);font-size:11px;line-height:1;color:#fff;background:var(--rose);padding:4px 7px;border-radius:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cover__ar{display:block;font-size:clamp(20px,2.6vw,34px);font-weight:300;margin-top:40px}
.cover__role{font-family:var(--lat);font-style:italic;color:var(--muted);font-size:clamp(14px,1.3vw,17px);margin-top:4px;text-align:right}
.cover__row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;margin-top:clamp(28px,4vw,48px);padding-top:clamp(24px,3vw,36px);border-top:1px solid var(--f-line)}
.cover__text{font-size:clamp(17px,1.7vw,22px);line-height:1.75;font-weight:300;max-width:26em}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border:1px solid var(--ink);border-radius:999px;font-size:15px;font-weight:500;transition:background .3s,color .3s,border-color .3s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn--solid{background:var(--rose);border-color:var(--rose);color:#fff}
.btn--solid:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
@media (max-width:900px){.folder__tab .t-full{display:none}.folder__tab .t-short{display:inline}}
@media (max-width:760px){.cover__row{grid-template-columns:1fr;gap:24px}}
@media (max-width:600px){
  .stack{--peek:62px;--tabh:42px;--ov:34px;margin-inline:calc(var(--pad) * -1 + 10px)}
  .folder{border-radius:22px 22px 0 0}
  .folder--cover{border-radius:22px;padding-inline:20px}
  .folder__tab{inset-inline-start:var(--xm,6%);font-size:13px;padding:0 15px;border-radius:15px 15px 0 0}
  .folder__meta{top:11px;inset-inline-end:18px;font-size:12px}
  .sel__text{font-size:clamp(50px,17vw,120px)}
  .btn{height:50px;padding:0 22px}
}

.stack .folder:last-child{height:calc(var(--peek) + 64px);border-bottom:1px solid var(--f-line);border-radius:26px;background:linear-gradient(var(--f-top),var(--f-cover) 90px)}
.sign{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(36px,5vw,56px)}
.sign__name{margin:0;font-weight:inherit}
.sign__icons{display:flex;gap:12px}
.sign__icons a,.sign__icons span{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .3s,color .3s,border-color .3s,transform .4s cubic-bezier(.34,1.5,.64,1)}
.sign__icons a:hover{background:var(--rose);border-color:var(--rose);color:#fff;transform:translateY(-3px)}
.sign__icons .is-off{opacity:.45}
.sign__icons svg{width:22px;height:22px}
@media (max-width:600px){.stack .folder:last-child{border-radius:22px}}

.stack--inner{--peek:104px;--tabh:44px;margin-top:clamp(56px,6vw,80px)}
.pfolder__body{position:absolute;top:14px;inset-inline:28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.pfolder__sum{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pfolder__go{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--f-line);display:grid;place-items:center;font-size:14px;transition:background .3s,color .3s,border-color .3s}
.pfolder:hover .pfolder__go{background:var(--rose);border-color:var(--rose);color:#fff}
.pfolder__soon{flex:none;font-size:12px;color:var(--muted);border:1px dashed var(--f-line);border-radius:999px;padding:3px 10px}
.folder.pfolder.is-nolink:hover{transform:none}
.pfolder.is-nolink:hover .folder__tab{color:inherit}
.stack--inner .folder__tab .lat{font-size:1.15em}
@media (max-width:600px){.stack--inner{--peek:98px;--tabh:40px;margin-inline:0}.pfolder__body{top:12px;inset-inline:18px}.pfolder__sum{font-size:13px}}

/* intro sequence: folders rise one after another, then the name is selected */
.js:not(.ready) .hero [data-in]{opacity:0;transform:translateY(18px)}
.js:not(.ready) .stack .folder{opacity:0;transform:translateY(90px)}
.ready:not(.settled) .hero [data-in]{transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--d,0) * 1ms)}
.ready:not(.settled) .stack .folder{transition:opacity .6s var(--ease),transform 1.1s cubic-bezier(.34,1.3,.64,1);transition-delay:calc(var(--i) * 85ms + 250ms)}
.js .sel__text{clip-path:inset(0 0 100% 0)}
.js .sel__box{clip-path:inset(0 100% 100% 0)}
.js .sel__h,.js .sel__tag,.js .sel__size{opacity:0}
.ready .sel__text{clip-path:inset(-10px);transition:clip-path 1.1s var(--ease) .9s}
.ready .sel__box{clip-path:inset(-14px);transition:clip-path .9s var(--ease) 1.5s}
.ready .sel__h,.ready .sel__tag,.ready .sel__size{opacity:1;transition:opacity .4s 2.2s,transform .3s var(--ease)}

/* ---------- Sections ---------- */
.section{padding:clamp(80px,12vw,160px) var(--pad)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(30px,5vw,60px)}
.h2{font-size:clamp(34px,5.6vw,84px);line-height:1.15;font-weight:500;letter-spacing:-.01em}
.count{color:var(--muted);font-size:15px}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:clamp(36px,5vw,64px)}
.filters button{height:42px;padding:0 18px;border:1px solid var(--line);border-radius:999px;font-size:14px;transition:border-color .25s,background .25s,color .25s;white-space:nowrap}
.filters button sup{font-size:10px;color:var(--muted);margin-inline-start:3px}
.filters button:hover{border-color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filters button[aria-pressed="true"] sup{color:inherit;opacity:.7}
@media (max-width:600px){
  .filters{flex-wrap:nowrap;overflow-x:auto;margin-inline:calc(var(--pad) * -1);padding-inline:var(--pad);scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
}

/* work grid */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:clamp(16px,2.4vw,36px);row-gap:clamp(48px,6vw,88px);align-items:start;transition:opacity .3s}
.grid.is-fading{opacity:0}
.work{grid-column:span var(--span,6);display:block}
.work[data-shift]{margin-top:clamp(0px,9vw,140px)}
.work__media{position:relative;margin:0;overflow:hidden;background:var(--surface);clip-path:inset(0);transition:clip-path .6s var(--ease)}
.work__media>svg,.work__media>img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.work__chip{position:absolute;inset-inline-start:0;bottom:0;background:var(--paper);color:var(--ink);font-size:13px;padding:10px 16px;transform:translateY(101%);transition:transform .5s var(--ease)}
.work__meta{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:16px}
.work__title{font-size:clamp(19px,1.8vw,24px);font-weight:500;line-height:1.35}
.work__title .lat{font-size:1.18em}
.work__year{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.work__cat{display:none;color:var(--muted);font-size:13px}
@media (hover:hover){
  .work:hover .work__media{clip-path:inset(2.5% 2.5% 2.5% 2.5%)}
  .work:hover .work__media>svg,.work:hover .work__media>img{transform:scale(1.06)}
  .work:hover .work__chip,.work:focus-visible .work__chip{transform:none}
}
@media (hover:none){.work__chip{display:none}.work__cat{display:block}}
@media (max-width:900px){.work{grid-column:span 6}.work[data-shift]{margin-top:60px}}
@media (max-width:600px){.work{grid-column:1/-1}.work[data-shift]{margin-top:0}.work__media{aspect-ratio:4/3.4!important}}
.empty{grid-column:1/-1;color:var(--muted)}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(40px,7vw,120px);border-top:1px solid var(--line)}
.about__lead{font-size:clamp(24px,2.9vw,40px);line-height:1.55;font-weight:300;margin-top:28px}
.about__lead em{font-style:normal;color:var(--rose-ink)}
.about__text{max-width:36em;color:var(--muted);margin-bottom:40px}
.fields{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.fields li{border-bottom:1px solid var(--line)}
.fields a{width:100%;display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:baseline;text-align:start;padding:20px 0;transition:padding .35s var(--ease),color .3s}
.fields b{font-weight:500;font-size:clamp(18px,1.6vw,22px)}
.fields small{grid-column:1;color:var(--muted);font-size:14px}
.fields span{grid-row:1/3;grid-column:2;align-self:center;font-size:13px;color:var(--muted);white-space:nowrap}
.fields a:hover{padding-inline-start:14px;color:var(--rose-ink)}
.tools{margin-top:32px;font-size:14px;color:var(--muted)}
.tools bdi{color:var(--ink)}
@media (max-width:860px){.about{grid-template-columns:1fr}}

/* contact */
.contact{background:var(--ink);color:var(--paper);border-radius:clamp(24px,3vw,40px) clamp(24px,3vw,40px) 0 0;margin-top:clamp(40px,6vw,80px)}
.contact .h2{font-size:clamp(40px,7.4vw,118px);line-height:1.12;max-width:11em}
.contact__sub{color:color-mix(in srgb,var(--paper) 62%,transparent);margin-top:22px;max-width:30em}
.links{list-style:none;margin:clamp(50px,7vw,90px) 0 0;padding:0;border-top:1px solid color-mix(in srgb,var(--paper) 18%,transparent)}
.links li{border-bottom:1px solid color-mix(in srgb,var(--paper) 18%,transparent)}
.links a{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 0;font-size:clamp(22px,2.6vw,36px);font-weight:500;transition:color .3s,padding .4s var(--ease)}
.links a span{font-size:15px;font-weight:400;color:color-mix(in srgb,var(--paper) 60%,transparent);direction:ltr}
.links a:hover{color:var(--rose);padding-inline:14px}
.foot{background:var(--ink);color:color-mix(in srgb,var(--paper) 60%,transparent);display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:28px var(--pad) calc(28px + env(safe-area-inset-bottom));font-size:13px;border-top:1px solid color-mix(in srgb,var(--paper) 12%,transparent)}
.foot a:hover{color:var(--paper)}

/* reveal */

<script>
(() => {
  "use strict";
  const root = document.documentElement;
  root.classList.add("js");
  const SITE = window.SITE || {}, CATS = window.CATEGORIES || [], PROJECTS = window.PROJECTS || [];
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (s, el = document) => el.querySelector(s);
  const isAr = s => /[\u0600-\u06FF]/.test(s || "");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const titleHTML = t => isAr(t) ? esc(t) : `<span class="lat" lang="en" dir="ltr">${esc(t)}</span>`;

  /* ---------- Default look for projects without their own images ---------- */
  const PALETTES = [
    ["#F3D3DC","#5A1E36","#E8467C","#FFF6F8"], ["#EAF2EC","#1E3A2B","#2E8B57","#F6FAF7"],
    ["#0E1B2C","#FFFFFF","#FFB020","#1B2C44"], ["#EFE4D6","#3B2A20","#A3683C","#F8F2EA"],
    ["#E9EEF8","#1D2B4F","#4C6FFF","#F5F7FC"], ["#FFF4DC","#3D2C00","#E09A00","#FFFAEE"],
    ["#1B1720","#FFFFFF","#F06A98","#2C2632"], ["#F2E8D8","#4A3B22","#B8913E","#FBF6EC"],
    ["#E6F4F6","#0F3D45","#1AA3B5","#F3FAFB"], ["#F1EAF7","#3A1F52","#9B5DE5","#F9F5FC"]

  const DEFAULT_ART = { initiatives: "poster", platforms: "browser", tests: "phone", prep: "browser", presentations: "slide", review: "grid", games: "mark" };
  PROJECTS.forEach((p, i) => {
    if (!p.colors) { p.colors = PALETTES[i % PALETTES.length]; p._autoColors = true; }
    if (!p.cover) {
      const a = DEFAULT_ART[p.category] || "poster";
      p.cover = a === "mark" ? { art: "mark", text: p.title.replace(/^[«\s]+/, "").charAt(0), sub: p.title } : { art: a, text: p.title };
    }
  });

  /* ---------- Placeholder artwork (replace with real images in projects.js) ---------- */
  const lum = hex => { const n = parseInt(hex.slice(1), 16); return (0.299*(n>>16) + 0.587*(n>>8&255) + 0.114*(n&255)) / 255; };
  const font = t => isAr(t) ? `font-family="Alexandria, sans-serif" font-weight="700"` : `font-family="Bodoni Moda, Didot, Georgia, serif"`;
  const crops = c => [[200,200,1,1],[800,200,-1,1],[200,800,1,-1],[800,800,-1,-1]].map(([x,y,sx,sy]) =>

  function art(spec, p) {
    const [bg, fg, ac, soft] = p.colors || ["#eee","#222","#E0447A","#fafafa"];
    const t = spec.text || "", sub = spec.sub || "";
    let b = "";
    switch (spec.art) {
      case "mark":
        b = `<rect width="1000" height="1000" fill="${bg}"/>${crops(fg)}
        <circle cx="500" cy="440" r="185" fill="${ac}"/>

        <rect x="150" y="740" width="240" height="8" fill="${fg}" opacity=".6"/><rect x="150" y="764" width="160" height="8" fill="${fg}" opacity=".35"/>`; break; }

          <rect x="18" y="418" width="194" height="34" rx="17" fill="${fg}"/></g>`;
        b = `<rect width="1000" height="1000" fill="${soft}"/>${ph(250, 290)}${ph(520, 240)}`; break; }
      case "browser":
        b = `<rect width="1000" height="1000" fill="${soft}"/><g transform="translate(140 225)">
        <rect width="720" height="550" rx="16" fill="${bg}" stroke="${fg}" stroke-opacity=".14" stroke-width="2"/>
        <rect width="720" height="44" rx="16" fill="${fg}" opacity=".06"/>${[24,46,68].map(x=>`<circle cx="${x}" cy="22" r="6" fill="${fg}" opacity=".25"/>`).join("")}
        <rect x="40" y="90" width="80" height="10" rx="5" fill="${fg}" opacity=".5"/>${[480,540,600].map(x=>`<rect x="${x}" y="90" width="44" height="10" rx="5" fill="${fg}" opacity=".25"/>`).join("")}
        <rect x="40" y="160" width="290" height="34" rx="4" fill="${fg}"/><rect x="40" y="208" width="230" height="34" rx="4" fill="${fg}"/>
        <rect x="40" y="270" width="250" height="10" rx="5" fill="${fg}" opacity=".3"/><rect x="40" y="292" width="200" height="10" rx="5" fill="${fg}" opacity=".3"/>
        <rect x="40" y="330" width="130" height="40" rx="20" fill="${ac}"/><rect x="390" y="140" width="290" height="240" rx="10" fill="${ac}" opacity=".9"/>
        <circle cx="535" cy="260" r="70" fill="${bg}" opacity=".35"/>
        ${[40,260,480].map(x=>`<rect x="${x}" y="410" width="200" height="110" rx="10" fill="${fg}" opacity=".07"/>`).join("")}</g>`; break;
      case "cards":
        b = `<rect width="1000" height="1000" fill="${soft}"/>
        <g transform="rotate(-8 500 500)"><rect x="255" y="300" width="470" height="275" rx="8" fill="${fg}"/>
          <circle cx="490" cy="420" r="52" fill="${ac}"/><text x="490" y="520" text-anchor="middle" font-size="30" letter-spacing="3" fill="${soft}" ${font(p.title)}>${esc(p.title)}</text></g>
        <g transform="rotate(5 500 500)"><rect x="300" y="430" width="470" height="275" rx="8" fill="#000" opacity=".08" transform="translate(10 14)"/>
          <rect x="300" y="430" width="470" height="275" rx="8" fill="${bg}"/><circle cx="720" cy="480" r="18" fill="${ac}"/>
          <rect x="340" y="600" width="170" height="10" rx="5" fill="${fg}" opacity=".7"/><rect x="340" y="624" width="120" height="8" rx="4" fill="${fg}" opacity=".35"/><rect x="340" y="644" width="140" height="8" rx="4" fill="${fg}" opacity=".35"/></g>`; break;
      case "pattern": {
        let s = "";
        for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
          const x = 80 + i * 120, y = 80 + j * 120;
          s += (i + j) % 2 ? `<circle cx="${x}" cy="${y}" r="38" fill="none" stroke="${ac}" stroke-width="12"/>` : `<circle cx="${x}" cy="${y}" r="9" fill="${fg}"/>`;
        }
        b = `<rect width="1000" height="1000" fill="${bg}"/>${s}`; break; }
      case "palette":
        b = (p.colors || []).map((c, i, a) => { const w = 1000 / a.length;
          return `<rect x="${i*w}" y="0" width="${w+1}" height="1000" fill="${c}"/><text x="${i*w+28}" y="770" font-size="26" font-family="Alexandria, sans-serif" fill="${lum(c) > .55 ? "#1F1A1D" : "#ffffff"}" opacity=".8">${c.toUpperCase()}</text>`; }).join(""); break;
      case "type":
        b = `<rect width="1000" height="1000" fill="${fg}"/>
        <text x="500" y="515" text-anchor="middle" dominant-baseline="central" font-size="430" fill="${bg}" ${font(t || "Aa")}>${esc(t || "Aa")}</text>
        <text x="500" y="770" text-anchor="middle" font-size="96" fill="${ac}" font-family="Alexandria, sans-serif" font-weight="700">أ ب ت</text>
        <text x="500" y="255" text-anchor="middle" font-size="28" letter-spacing="8" fill="${bg}" opacity=".55" font-family="Bodoni Moda, Georgia, serif">Aa Bb Cc 0123</text>`; break;
      case "grid": {
        let d = "";
        for (let i = 0; i < 10; i++) for (let j = 0; j < 10; j++) d += `<circle cx="${185+i*70}" cy="${185+j*70}" r="4" fill="${fg}" opacity=".28"/>`;
        const pts = [[255,605],[395,465],[465,535],[605,325],[745,395]];
        b = `<rect width="1000" height="1000" fill="${bg}"/>${d}
        <polyline points="${pts.map(q=>q.join(",")).join(" ")}" fill="none" stroke="${ac}" stroke-width="7" stroke-linejoin="round"/>
        ${pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="15" fill="${bg}" stroke="${ac}" stroke-width="6"/>`).join("")}
        <rect x="185" y="745" width="210" height="12" rx="6" fill="${fg}" opacity=".6"/>`; break; }
      case "slide": {
        const nums = ["١","٢","٣","٤","٥","٦"];
        b = `<rect width="1000" height="1000" fill="${soft}"/><rect x="120" y="225" width="760" height="550" fill="${bg}" stroke="${ac}" stroke-width="3"/>
        <rect x="138" y="243" width="724" height="514" fill="none" stroke="${ac}" stroke-width="1" opacity=".6"/>
        <text x="500" y="318" text-anchor="middle" font-size="40" fill="${fg}" font-family="Alexandria, sans-serif" font-weight="700">${esc(p.title)}</text>
        ${nums.map((n,i)=>{const x=180+(i%3)*220,y=370+Math.floor(i/3)*180;return `<rect x="${x}" y="${y}" width="200" height="150" fill="${soft}" stroke="${ac}" stroke-opacity=".5"/>
          <circle cx="${x+160}" cy="${y+38}" r="22" fill="${ac}"/><text x="${x+160}" y="${y+40}" text-anchor="middle" dominant-baseline="central" font-size="24" fill="${soft}" font-family="Alexandria, sans-serif">${n}</text>
          <rect x="${x+30}" y="${y+86}" width="140" height="9" rx="4" fill="${fg}" opacity=".45"/><rect x="${x+60}" y="${y+106}" width="110" height="9" rx="4" fill="${fg}" opacity=".25"/>`}).join("")}`; break; }
      default:
        b = `<rect width="1000" height="1000" fill="${soft}"/>`;
    }
    return `<svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" style="direction:ltr" role="img" aria-label="${esc(p.title)}: ${esc(spec.caption || "صورة توضيحية مؤقتة")}">${b}</svg>`;
  }
  function media(spec, p, alt) {
    const src = typeof spec === "string" ? spec : spec && spec.src;
    if (src) return `<img src="${esc(src)}" alt="${esc(alt || p.title)}" loading="lazy" decoding="async">`;
    return art(spec || {}, p);
  }

  /* ---------- Work grid ---------- */
  const PATTERN = [
    { span: 7, ratio: "4/3" }, { span: 5, ratio: "4/5", shift: 1 },
    { span: 5, ratio: "1/1" }, { span: 7, ratio: "16/10", shift: 1 },
    { span: 4, ratio: "4/5" }, { span: 4, ratio: "4/5", shift: 1 }, { span: 4, ratio: "4/5" }
  ];
  let visible = PROJECTS.slice();
  const countText = n => n === 0 ? "لا مشاريع بعد" : n === 1 ? "مشروع واحد" : n === 2 ? "مشروعان" : n <= 10 ? `${n} مشاريع` : `${n} مشروعًا`;
  const byCat = id => PROJECTS.filter(p => p.category === id);

  function cardsHTML(list) {
    return list.length ? list.map((p, i) => {
      const L = PATTERN[i % PATTERN.length], cat = CAT[p.category] || {};
      return `<a class="work" href="#/work/${esc(p.slug)}" style="--span:${L.span}" ${L.shift ? "data-shift" : ""} data-reveal data-cursor="open">
        <figure class="work__media" style="aspect-ratio:${L.ratio}">${media(p.cover, p, p.title)}<span class="work__chip">${esc(cat.label || "")}</span></figure>
        <div class="work__meta"><div><h3 class="work__title">${titleHTML(p.title)}</h3><p class="work__cat">${esc(cat.short || "")}</p></div>${p.year ? `<span class="work__year">${esc(p.year)}</span>` : ""}</div>
      </a>`;
    }).join("") : `<p class="empty">لا توجد مشاريع في هذا المجال بعد.</p>`;
  }
  /* ---------- Folder stack (hero) ---------- */
  // ترتيب الملفات من الخلف إلى الأمام. x موضع اللسان على الكمبيوتر، xm على الجوال (نسبة من العرض)
  const POS = [[70, 56], [6, 4], [46, 40], [22, 14], [58, 46], [32, 24], [10, 6]];
  const FOLDERS = [
    ...CATS.map(c => ({ href: `#/folder/${c.id}`, full: c.label, short: c.short !== c.label ? c.short : null, n: byCat(c.id).length }))
  ];
  const stack = $("#stack");
  stack.insertAdjacentHTML("afterbegin", FOLDERS.map((f, i) => {
    const [x, xm] = POS[i % POS.length];
    const label = f.short ? `<span class="t-full">${esc(f.full)}</span><span class="t-short">${esc(f.short)}</span>` : esc(f.full);
    return `<a class="folder${i === 0 ? " folder--accent" : ""}" href="${f.href}" style="--x:${x}%;--xm:${xm}%;--i:${i}" data-cursor="open">
      <span class="folder__tab">${label}${f.n != null ? `<small>${f.n}</small>` : ""}</span></a>`;
  }).join(""));

  /* ---------- Name + contact icons under the folders (empty values are hidden) ---------- */
  const c = SITE.contact || {};
  const ICONS = {
    whatsapp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.2a8.8 8.8 0 0 0-7.6 13.2L3.2 20.8l4.5-1.2A8.8 8.8 0 1 0 12 3.2z"/><path d="M9 8.3c.1 3.6 3 6.5 6.6 6.6l.9-1.6-2-1-.9.8a4.8 4.8 0 0 1-2.8-2.8l.8-.9-1-2z" fill="currentColor" stroke-width="1"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3.5v11.2a3.6 3.6 0 1 1-3.6-3.6"/><path d="M14 3.5c.4 2.6 2.3 4.3 5 4.5"/></svg>'
  };
  const icons = [];
  icons.push(["whatsapp", c.whatsapp ? `https://wa.me/${String(c.whatsapp).replace(/\D/g, "")}` : "", "تواصل عبر واتساب"]);
  if (c.tiktok) icons.push(["tiktok", `https://www.tiktok.com/@${c.tiktok}`, `حساب تيك توك @${c.tiktok}`]);
  $("#sign-icons").innerHTML = icons.map(([k, href, label]) => !href
    ? `<span class="is-off" aria-hidden="true" title="أضيفي رقم واتساب في projects.js">${ICONS[k]}</span>`
    : `<a href="${esc(href)}" target="_blank" rel="noopener" aria-label="${esc(label)}" title="${esc(label)}" data-cursor="link">${ICONS[k]}</a>`).join("");
  if (!c.whatsapp) console.info("Portfolio: أضيفي رقم واتساب في SITE.contact داخل projects.js لتظهر أيقونته.");

  /* ---------- Overlays: opened folder + case study ---------- */
  const caseEl = $("#case"), fviewEl = $("#fview");
  const state = { slug: null, folder: null, menu: false };
  const focusBack = { case: null, folder: null };
  const syncLock = () => root.classList.toggle("is-locked", !!(state.slug || state.folder || state.menu));

  // كل مشروع داخل المجلد يظهر كملف؛ الضغط عليه يفتح رابط المشروع (link في projects.js)
  function projectFolders(list) {
    return list.map((p, i) => {
      const [x, xm] = POS[i % POS.length];
      const inner = `<span class="folder__tab">${titleHTML(p.title)}</span>
        <span class="pfolder__body"><span class="pfolder__sum">${esc(p.summary || p.subtitle || "")}</span>${p.link ? `<span class="pfolder__go" aria-hidden="true">↗</span>` : `<span class="pfolder__soon">الرابط قريبًا</span>`}</span>`;
      const st = `style="--x:${x}%;--xm:${xm}%;--i:${i}"`;
      return p.link
        ? `<a class="folder pfolder" href="${esc(p.link)}" target="_blank" rel="noopener" ${st} data-cursor="open" aria-label="${esc(p.title)}، يفتح الموقع في نافذة جديدة">${inner}</a>`
        : `<div class="folder pfolder is-nolink" ${st}>${inner}</div>`;
    }).join("");
  }
  function folderHTML(id) {
    const cat = CAT[id], list = byCat(id);
    const others = CATS.filter(x => x.id !== id).map(x => `<a class="ftab" href="#/folder/${x.id}">${esc(x.label)}</a>`).join("");
    return `<div class="case__bar">
        <a class="pill pill--close" href="#top" data-close-folder>إغلاق<span class="sr"> الملف</span></a>
        <span class="fview__crumb">${esc(cat.label)}</span>
      </div>
      <div class="fview__wrap">
        <span class="ftab"><bdi>${countText(list.length)}</bdi></span>
        <div class="fview__head">
          <h2 class="fview__title" id="fview-title">${esc(cat.label)}</h2>
          <p class="fview__note">${esc(cat.note || "")}</p>
        </div>
        <div class="stack stack--inner">${projectFolders(list)}</div>
        <div class="fview__others"><p>ملفات أخرى</p><div class="fview__tabs">${others}</div></div>
      </div>`;
  }
  function openFolder(id, src) {
    if (!CAT[id]) { requestCloseFolder(); return; }
    if (state.folder === id) return;
    const wasOpen = !!state.folder;
    if (!wasOpen) focusBack.folder = document.activeElement;
    state.folder = id;
    fviewEl.innerHTML = folderHTML(id);
    fviewEl.scrollTop = 0;
    if (!wasOpen && src && !reduce) {
      // the panel grows out of the folder that was pulled
      fviewEl.style.transition = "none";
      fviewEl.style.clipPath = `inset(${Math.max(src.top, 0)}px ${innerWidth - src.right}px 0px ${src.left}px round 26px)`;
      void fviewEl.offsetWidth;
      fviewEl.style.transition = ""; fviewEl.style.clipPath = "";
    }
    fviewEl.classList.add("is-open");
    syncLock();
    observe(fviewEl.querySelectorAll("[data-reveal]"), fviewEl);
    setTimeout(() => fviewEl.focus({ preventScroll: true }), 60);
  }
  function closeFolder() {
    if (!state.folder) return;
    state.folder = null;
    fviewEl.classList.remove("is-open");
    syncLock();
    const f = focusBack.folder; if (f && document.contains(f)) f.focus({ preventScroll: true });
  }

  function caseHTML(p) {
    const base = state.folder && CAT[state.folder] ? byCat(state.folder) : visible;
    const list = base.includes(p) ? base : PROJECTS;
    const i = list.indexOf(p), prev = list[(i - 1 + list.length) % list.length], next = list[(i + 1) % list.length];
    const cat = CAT[p.category] || {};
    const gal = (p.gallery || []).map(item => {
      const lay = item.layout === "full" ? "g-full" : item.layout === "wide" ? "g-wide" : "g-half";
      return `<figure class="${lay}" data-reveal><div class="g-media">${media(item, p, item.caption)}</div>${item.caption ? `<figcaption>${esc(item.caption)}</figcaption>` : ""}</figure>`;
    }).join("");
    return `<div class="case__bar">
        <a class="pill pill--close" href="#top" data-close>إغلاق<span class="sr"> المشروع</span></a>
        <nav aria-label="التنقل بين المشاريع"><a class="pill" href="#/work/${esc(prev.slug)}">السابق<span class="sr">: ${esc(prev.title)}</span></a><a class="pill" href="#/work/${esc(next.slug)}">التالي<span class="sr">: ${esc(next.title)}</span></a></nav>
      </div>
      <article class="case__wrap">
        <p class="case__cat">${esc(cat.label || "")}</p>
        <h2 class="case__title${isAr(p.title) ? "" : " is-lat"}" id="case-title" ${isAr(p.title) ? "" : 'lang="en"'}>${esc(p.title)}</h2>
        ${p.subtitle ? `<p class="case__sub">${titleHTML(p.subtitle)}</p>` : ""}
        <div class="case__intro">
          <div><p class="case__summary">${esc(p.summary)}</p>${p.link ? `<a class="btn btn--solid case__visit" href="${esc(p.link)}" target="_blank" rel="noopener">زيارة المشروع</a>` : ""}</div>
          <dl class="meta"><dt>المجال</dt><dd>${esc(cat.label || "")}</dd>${p.year ? `<dt>السنة</dt><dd>${esc(p.year)}</dd>` : ""}${p.role ? `<dt>دوري</dt><dd>${esc(p.role)}</dd>` : ""}${p.tools ? `<dt>الأدوات</dt><dd>${esc(p.tools)}</dd>` : ""}</dl>
        </div>
        <figure class="case__hero">${media(p.hero || p.cover, p, p.title)}</figure>
        ${p.idea || p.goal ? `<div class="story">${p.idea ? `<div data-reveal><h3>الفكرة</h3><p>${esc(p.idea)}</p></div>` : ""}${p.goal ? `<div data-reveal><h3>الهدف</h3><p>${esc(p.goal)}</p></div>` : ""}</div>` : ""}
        ${gal ? `<div class="gallery">${gal}</div>` : ""}
        ${p.colors && !p._autoColors ? `<div class="palette" data-reveal role="img" aria-label="ألوان المشروع">${p.colors.map(col => `<div style="background:${col};color:${lum(col) > .55 ? "#1F1A1D" : "#fff"}">${col.toUpperCase()}</div>`).join("")}</div>` : ""}
        <a class="next" href="#/work/${esc(next.slug)}" data-cursor="open">
          <div><small>المشروع التالي</small><strong class="${isAr(next.title) ? "" : "lat"}" ${isAr(next.title) ? "" : 'dir="ltr" lang="en"'}>${esc(next.title)}</strong></div>
          <div class="g-media">${media(next.cover, next, next.title)}</div>
        </a>
      </article>`;
  }
  function openCase(slug) {
    const p = PROJECTS.find(x => x.slug === slug);
    if (!p) { requestCloseCase(); return; }
    if (state.slug === slug) return;
    const wasOpen = !!state.slug;
    if (!wasOpen) focusBack.case = document.activeElement;
    state.slug = slug;
    caseEl.innerHTML = caseHTML(p);
    caseEl.scrollTop = 0;
    document.title = `${p.title} | Reem Alharbi`;
    caseEl.classList.add("is-open");
    syncLock();
    observe(caseEl.querySelectorAll("[data-reveal]"), caseEl);
    setTimeout(() => caseEl.focus({ preventScroll: true }), wasOpen ? 0 : 60);
  }
  function closeCase() {
    if (!state.slug) return;
    state.slug = null;
    caseEl.classList.remove("is-open");
    syncLock();
    document.title = "Reem Alharbi | مصممة جرافيك ومطوّرة واجهات";
    const f = focusBack.case; if (f && document.contains(f)) f.focus({ preventScroll: true });
  }

  /* routing: #/folder/<category> and #/work/<slug> */
  function route(src) {
    const h = location.hash; let m;
    if ((m = h.match(/^#\/folder\/([\w-]+)/))) { closeCase(); openFolder(m[1], src); }
    else if ((m = h.match(/^#\/work\/([\w-]+)/))) openCase(m[1]);
    else { closeCase(); closeFolder(); }
  }
  function navigate(href, replace, src) {
    if (replace) history.replaceState(history.state, "", href);
    else history.pushState({ app: true }, "", href);
    route(src);
  }
  const fromApp = () => history.state && history.state.app;
  function requestCloseCase() {
    if (fromApp()) history.back();
    else { history.replaceState(null, "", state.folder ? `#/folder/${state.folder}` : location.pathname + location.search); route(); }
  }
  function requestCloseFolder() {
    if (fromApp()) history.back();
    else { history.replaceState(null, "", location.pathname + location.search); route(); }
  }
  document.addEventListener("click", e => {
    if (e.target.closest("[data-close]")) { e.preventDefault(); requestCloseCase(); return; }
    if (e.target.closest("[data-close-folder]")) { e.preventDefault(); requestCloseFolder(); return; }
    const a = e.target.closest('a[href^="#/"]');
    if (!a || e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    const href = a.getAttribute("href"), isWork = href.startsWith("#/work/");
    const replace = (isWork && !!state.slug) || (!isWork && !!state.folder);
    if (a.classList.contains("folder") && !reduce) {
      a.classList.add("is-pulling");
      setTimeout(() => { const r = a.getBoundingClientRect(); a.classList.remove("is-pulling"); navigate(href, false, r); }, 260);
    } else navigate(href, replace);
  });
  addEventListener("popstate", () => route());
  addEventListener("hashchange", () => route());

  function trap(e, el) {
    const f = [...el.querySelectorAll("a[href],button")].filter(n => n.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && (document.activeElement === f[0] || document.activeElement === el)) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
  addEventListener("keydown", e => {
    const top = state.slug ? caseEl : state.folder ? fviewEl : null;
    if (!top) return;
    if (e.key === "Escape") { e.preventDefault(); state.slug ? requestCloseCase() : requestCloseFolder(); }
    if (e.key === "Tab") trap(e, top);
  });

  /* ---------- Reveal on scroll ---------- */
  const ios = new Map();
  function observe(nodes, scroller = null) {
    if (reduce || !("IntersectionObserver" in window)) { nodes.forEach(n => n.classList.add("in")); return; }
    const key = scroller || document;
    if (!ios.has(key)) ios.set(key, new IntersectionObserver(es => es.forEach(en => {
      if (en.isIntersecting) { en.target.classList.add("in"); ios.get(key).unobserve(en.target); }
    }), { root: scroller, rootMargin: "0px 0px -8% 0px", threshold: .08 }));
    nodes.forEach(n => ios.get(key).observe(n));
  }

  /* ---------- Header, menu, theme ---------- */
  const bar = $("#top-bar");
  const onScroll = () => bar.classList.toggle("is-scrolled", scrollY > 30);
  addEventListener("scroll", onScroll, { passive: true }); onScroll();
  $(".theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
  });

  /* ---------- Custom cursor (fine pointers only) ---------- */
  if (matchMedia("(hover: hover) and (pointer: fine)").matches && !reduce) {
    const cur = $(".cursor"); let x = -100, y = -100, cx = x, cy = y;
    root.classList.add("has-cursor");
    addEventListener("pointermove", e => { x = e.clientX; y = e.clientY; });
    document.addEventListener("pointerover", e => {
      const t = e.target.closest("[data-cursor], a, button");
      cur.classList.toggle("is-open", !!(t && t.dataset.cursor === "open"));
      cur.classList.toggle("is-link", !!(t && t.dataset.cursor !== "open"));
    });
    document.addEventListener("pointerleave", () => { x = y = -100; });
    (function tick() { cx += (x - cx) * .22; cy += (y - cy) * .22;
      cur.style.transform = `translate(${cx}px,${cy}px)`; requestAnimationFrame(tick); })();
  }

  /* ---------- Init ---------- */
  route();
  observe(document.querySelectorAll("main > section [data-reveal]"));
  const start = () => { requestAnimationFrame(() => root.classList.add("ready")); setTimeout(() => root.classList.add("settled"), reduce ? 0 : 2000); };
  if (document.fonts && document.fonts.ready) Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1200))]).then(start); else start();
})();
</script>
</body>
</html>
